<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromoterSync - Inter-Company Task Management</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html2pdf.js CDN for PDF Summary Reports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase App & Firestore Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    .hidden-gate { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- STATIC PIN GATE OVERLAY -->
  <div id="pin-gate" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 w-full max-w-md text-center">
      <h1 class="text-2xl font-bold text-blue-400 mb-2">PromoterSync Access</h1>
      <p class="text-sm text-slate-400 mb-6">Enter access PIN to continue</p>
      <input type="password" id="pin-input" maxlength="8" placeholder="Enter PIN" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-center text-xl tracking-widest text-white mb-4 focus:outline-none focus:border-blue-500">
      <button onclick="verifyPin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition-colors">Unlock System</button>
      <p id="pin-error" class="text-red-400 text-sm mt-3 hidden">Incorrect PIN. Please try again.</p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden-gate max-w-7xl mx-auto px-4 py-6">
    
    <!-- HEADER & PROMOTER SWITCHER -->
    <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-blue-400 tracking-tight">PromoterSync</h1>
        <p class="text-slate-400 text-sm mt-1">Inter-Company Operations Task Dashboard</p>
      </div>
      
      <div class="flex items-center gap-4 bg-slate-800/80 p-3 rounded-lg border border-slate-700">
        <label for="promoter-select" class="text-xs uppercase tracking-wider font-bold text-slate-400">Current Role:</label>
        <select id="promoter-select" onchange="switchPromoter(this.value)" class="bg-slate-900 border border-slate-700 text-blue-400 font-semibold rounded px-3 py-1 text-sm focus:outline-none">
          <option value="DR">Promoter DR</option>
          <option value="NG">Promoter NG</option>
        </select>
        <button onclick="exportToPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs px-3 py-1.5 rounded transition">Download PDF Report</button>
        <button onclick="lockApp()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded transition">Lock Session</button>
      </div>
    </header>

    <!-- DASHBOARD ACTIONS & CONTROLS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      
      <!-- CREATE NEW TASK FORM -->
      <div class="md:col-span-1 bg-slate-800/50 p-6 rounded-xl border border-slate-800">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center justify-between">
          <span>Create Task</span>
          <span id="next-task-id" class="text-xs text-blue-400 font-mono">ID: ...</span>
        </h2>
        
        <form id="create-task-form" onsubmit="handleCreateTask(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Task Title</label>
            <input type="text" id="task-title" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          </div>
          
          <div>
            <label class="block text-xs text-slate-400 mb-1">Assigned Promoter</label>
            <select id="task-assignee" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none">
              <option value="DR">Promoter DR</option>
              <option value="NG">Promoter NG</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Linked Decision / Ref</label>
            <input type="text" id="task-decision" placeholder="e.g. Agreement #402" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded text-sm transition">Add Task to Cloud</button>
        </form>
      </div>

      <!-- DASHBOARD METRICS OVERVIEW -->
      <div class="md:col-span-2 grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-slate-800/30 border border-slate-800 p-4 rounded-xl flex flex-col justify-between">
          <span class="text-xs font-medium text-slate-400 uppercase">Total Tasks</span>
          <span id="stat-total" class="text-3xl font-bold text-slate-100 mt-2">0</span>
        </div>
        <div class="bg-slate-800/30 border border-slate-800 p-4 rounded-xl flex flex-col justify-between">
          <span class="text-xs font-medium text-yellow-400 uppercase">On Hold</span>
          <span id="stat-hold" class="text-3xl font-bold text-yellow-400 mt-2">0</span>
        </div>
        <div class="bg-slate-800/30 border border-slate-800 p-4 rounded-xl flex flex-col justify-between">
          <span class="text-xs font-medium text-blue-400 uppercase">Active</span>
          <span id="stat-active" class="text-3xl font-bold text-blue-400 mt-2">0</span>
        </div>
        <div class="bg-slate-800/30 border border-slate-800 p-4 rounded-xl flex flex-col justify-between">
          <span class="text-xs font-medium text-emerald-400 uppercase">Completed</span>
          <span id="stat-completed" class="text-3xl font-bold text-emerald-400 mt-2">0</span>
        </div>
      </div>
    </div>

    <!-- TASK LIST BOARD -->
    <main>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-slate-200">Inter-Company Tasks</h2>
        <span class="text-xs text-slate-500">Synced Real-Time with Firebase Cloud</span>
      </div>

      <div id="tasks-container" class="space-y-4">
        <div class="text-center py-12 text-slate-500">Loading tasks from cloud...</div>
      </div>
    </main>
  </div>

  <!-- FIREBASE CONFIG & APPLICATION CORE LOGIC -->
  <script>
    // 1. PIN SECURITY GATE
    const STATIC_PIN = "1234"; // Set your standard PIN here
    
    function verifyPin() {
      const input = document.getElementById("pin-input").value;
      if (input === STATIC_PIN) {
        sessionStorage.setItem("ps_auth", "true");
        document.getElementById("pin-gate").classList.add("hidden-gate");
        document.getElementById("app-container").classList.remove("hidden-gate");
      } else {
        document.getElementById("pin-error").classList.remove("hidden");
      }
    }

    function lockApp() {
      sessionStorage.removeItem("ps_auth");
      location.reload();
    }

    if (sessionStorage.getItem("ps_auth") === "true") {
      document.getElementById("pin-gate").classList.add("hidden-gate");
      document.getElementById("app-container").classList.remove("hidden-gate");
    }

    // 2. FIREBASE INITIALIZATION WITH YOUR EXACT CREDENTIALS
    const firebaseConfig = {
      apiKey: "AIzaSyArP8ZKt7bpftq3hthAvpGU8rXCPq_9sEk",
      authDomain: "promotersync.firebaseapp.com",
      projectId: "promotersync",
      storageBucket: "promotersync.firebasestorage.app",
      messagingSenderId: "274799726455",
      appId: "1:274799726455:web:5e9d0be719a285b1ac9b72"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 3. APPLICATION STATE
    let currentPromoter = "DR";
    let allTasks = [];

    function switchPromoter(role) {
      currentPromoter = role;
      updateNextTaskId(allTasks);
      renderTasks(allTasks);
    }

    // 4. REAL-TIME FIREBASE SYNC (FIRESTORE)
    function initializeCloudSync() {
      db.collection("tasks").onSnapshot((snapshot) => {
        allTasks = [];
        snapshot.forEach((doc) => {
          allTasks.push(doc.data());
        });
        
        // Client-side sort to avoid Firestore index requirement issues
        allTasks.sort((a, b) => b.createdAt - a.createdAt);
        
        updateMetrics(allTasks);
        renderTasks(allTasks);
      }, (error) => {
        console.error("Firebase sync error: ", error);
      });
    }

    // 5. CREATE TASK LOGIC
    function handleCreateTask(e) {
      e.preventDefault();
      
      const title = document.getElementById("task-title").value;
      const assignee = document.getElementById("task-assignee").value;
      const decision = document.getElementById("task-decision").value;
      
      // Dynamic Suffix based on Creator Role (A for DR, B for NG)
      const suffix = currentPromoter === "DR" ? "A" : "B";
      const taskIndex = String(allTasks.length + 1).padStart(3, '0');
      const taskId = `${taskIndex} - ${suffix}`;

      const newTask = {
        id: taskId,
        title: title,
        creator: currentPromoter,
        assignee: assignee,
        decisionLink: decision || "None",
        status: "Active", // Active, Hold, Completed
        subTasks: [],
        createdAt: Date.now()
      };

      // Save directly to Firebase Firestore
      db.collection("tasks").doc(taskId).set(newTask)
        .then(() => {
          document.getElementById("create-task-form").reset();
        })
        .catch((err) => alert("Error creating task: " + err.message));
    }

    // 6. UPDATE / EDIT TASK FUNCTIONALITY
    function toggleHoldStatus(taskId, currentStatus) {
      const task = allTasks.find(t => t.id === taskId);
      if (task.creator !== currentPromoter) {
        alert(`Permissions Restricted: Only Promoter ${task.creator} can edit this task rule.`);
        return;
      }

      const newStatus = currentStatus === "Hold" ? "Active" : "Hold";
      db.collection("tasks").doc(taskId).update({ status: newStatus });
    }

    function toggleCompleteStatus(taskId, currentStatus) {
      const task = allTasks.find(t => t.id === taskId);
      if (task.creator !== currentPromoter) {
        alert(`Permissions Restricted: Only Promoter ${task.creator} can mark this complete.`);
        return;
      }

      const newStatus = currentStatus === "Completed" ? "Active" : "Completed";
      db.collection("tasks").doc(taskId).update({ status: newStatus });
    }

    function addSubTask(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      if (task.creator !== currentPromoter) {
        alert(`Permissions Restricted: Only Promoter ${task.creator} can edit this task.`);
        return;
      }

      if (task.subTasks && task.subTasks.length >= 5) {
        alert("Sub-task limit reached! Maximum 5 allowed per task.");
        return;
      }

      const subTitle = prompt("Enter sub-task item:");
      if (subTitle) {
        const updatedSubTasks = task.subTasks || [];
        updatedSubTasks.push({ title: subTitle, completed: false });
        
        db.collection("tasks").doc(taskId).update({ subTasks: updatedSubTasks });
      }
    }

    function toggleSubTask(taskId, subIndex) {
      const task = allTasks.find(t => t.id === taskId);
      if (task.creator !== currentPromoter) {
        alert(`Permissions Restricted: Only Promoter ${task.creator} can edit this task.`);
        return;
      }

      const updatedSubTasks = [...task.subTasks];
      updatedSubTasks[subIndex].completed = !updatedSubTasks[subIndex].completed;

      db.collection("tasks").doc(taskId).update({ subTasks: updatedSubTasks });
    }

    // 7. PDF SUMMARY REPORT GENERATOR
    function exportToPDF() {
      const element = document.getElementById("app-container");
      const opt = {
        margin:       0.5,
        filename:     `PromoterSync_Report_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
      };
      
      html2pdf().set(opt).from(element).save();
    }

    // 8. DASHBOARD UI RENDERER
    function updateNextTaskId(tasks) {
      const suffix = currentPromoter === "DR" ? "A" : "B";
      const nextId = String(tasks.length + 1).padStart(3, '0') + ` - ${suffix}`;
      document.getElementById("next-task-id").innerText = `Next ID: ${nextId}`;
    }

    function updateMetrics(tasks) {
      document.getElementById("stat-total").innerText = tasks.length;
      document.getElementById("stat-hold").innerText = tasks.filter(t => t.status === "Hold").length;
      document.getElementById("stat-active").innerText = tasks.filter(t => t.status === "Active").length;
      document.getElementById("stat-completed").innerText = tasks.filter(t => t.status === "Completed").length;
      updateNextTaskId(tasks);
    }

    function renderTasks(tasks) {
      const container = document.getElementById("tasks-container");
      
      if (tasks.length === 0) {
        container.innerHTML = `<div class="text-center py-12 bg-slate-800/30 rounded-xl border border-slate-800 text-slate-500">No tasks created yet. Use the panel on the left to start.</div>`;
        return;
      }

      container.innerHTML = tasks.map(task => {
        const isOwner = task.creator === currentPromoter;
        const subTasks = task.subTasks || [];

        return `
          <div class="bg-slate-800/60 border ${task.status === 'Hold' ? 'border-yellow-500/40' : task.status === 'Completed' ? 'border-emerald-500/40' : 'border-slate-700'} p-5 rounded-xl transition">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-700/50 pb-3 mb-3">
              <div class="flex items-center gap-3">
                <span class="font-mono text-xs font-bold text-blue-400 bg-blue-950 px-2 py-1 rounded border border-blue-800/50">${task.id}</span>
                <h3 class="text-lg font-semibold text-slate-100 ${task.status === 'Completed' ? 'line-through text-slate-400' : ''}">${task.title}</h3>
                <span class="text-xs px-2 py-0.5 rounded ${task.status === 'Hold' ? 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/30' : task.status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-blue-500/10 text-blue-400 border border-blue-500/30'}">${task.status}</span>
              </div>
              <div class="flex items-center gap-2 text-xs text-slate-400">
                <span>Creator: <strong class="text-slate-200">${task.creator}</strong></span>
                <span>•</span>
                <span>Assignee: <strong class="text-slate-200">${task.assignee}</strong></span>
              </div>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div class="text-xs text-slate-400">
                <span class="block">Linked Decision: <strong class="text-slate-300">${task.decisionLink}</strong></span>
                <span class="block mt-1">Sub-tasks: ${subTasks.length}/5</span>
              </div>

              <!-- ACTION CONTROLS -->
              <div class="flex items-center gap-2">
                <button onclick="addSubTask('${task.id}')" ${!isOwner ? 'disabled class="opacity-40 cursor-not-allowed bg-slate-700 text-slate-400 text-xs px-3 py-1.5 rounded"' : 'class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded transition"'}>
                  + Sub-task
                </button>
                <button onclick="toggleHoldStatus('${task.id}', '${task.status}')" ${!isOwner ? 'disabled class="opacity-40 cursor-not-allowed bg-slate-700 text-slate-400 text-xs px-3 py-1.5 rounded"' : 'class="bg-yellow-600/20 hover:bg-yellow-600/30 text-yellow-400 border border-yellow-500/40 text-xs px-3 py-1.5 rounded transition"'}>
                  ${task.status === 'Hold' ? 'Resume' : 'Put on Hold'}
                </button>
                <button onclick="toggleCompleteStatus('${task.id}', '${task.status}')" ${!isOwner ? 'disabled class="opacity-40 cursor-not-allowed bg-slate-700 text-slate-400 text-xs px-3 py-1.5 rounded"' : 'class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/40 text-xs px-3 py-1.5 rounded transition"'}>
                  ${task.status === 'Completed' ? 'Reopen' : 'Mark Complete'}
                </button>
              </div>
            </div>

            <!-- SUB-TASKS LIST -->
            ${subTasks.length > 0 ? `
              <div class="mt-4 pt-3 border-t border-slate-700/30 space-y-1.5">
                ${subTasks.map((st, idx) => `
                  <div class="flex items-center gap-2 text-xs text-slate-300">
                    <input type="checkbox" ${st.completed ? 'checked' : ''} ${!isOwner ? 'disabled' : ''} onchange="toggleSubTask('${task.id}', ${idx})" class="rounded bg-slate-900 border-slate-700 text-blue-500">
                    <span class="${st.completed ? 'line-through text-slate-500' : ''}">${st.title}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Initialize Firebase Listener when Document Loads
    document.addEventListener("DOMContentLoaded", initializeCloudSync);
  </script>
</body>
</html>
